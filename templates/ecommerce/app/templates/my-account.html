                // Mega Menu

                    $('.js-mega-menu').HSMegaMenu({
                        event: 'hover',
                        direction: 'horizontal',
                        pageContainer: $('.container'),
                        breakpoint: 767.98,
                        hideTimeOut: 0
                    });
                }

                // Header
                if ($('#header').length) {
                    $.HSCore.components.HSHeader.init($('#header'));
                }

                // Unfold (général)
                if ($('[data-unfold-target]').length) {
                    $.HSCore.components.HSUnfold.init($('[data-unfold-target]'));
                }

                // Slick Carousel
                $('.js-slick-carousel.slick-initialized').slick('unslick');
                if ($('.js-slick-carousel').length) {
                    $.HSCore.components.HSSlickCarousel.init('.js-slick-carousel');
                }

                // Fancybox
                if ($('.js-fancybox').length) {

                // Validation
                if ($.HSCore.components.HSValidation) {
                    $.HSCore.components.HSValidation.init('.js-validate', {
                        rules: {

                    $('.js-select').selectpicker('refresh');
                }
            }

        <!-- ===============================================
            3. FONCTION D'INITIALISATION SPÉCIFIQUE AUTH
            =============================================== -->
        <script>
            function initAuth() {
                console.log("🎯 INIT AUTH - VERSION COMPLÈTE");
                
                const sidebar = document.getElementById('sidebarContent');
                const bouton = document.getElementById('sidebarNavToggler');
                
                if (!sidebar || !bouton) {
                    console.error("❌ Éléments manquants");
                    return;
                }
                
                // 1. Cacher la sidebar au départ
                sidebar.style.display = 'none';
                
                // 2. Ouvrir/fermer avec le bouton
                bouton.addEventListener('click', function(e) {
                    e.preventDefault();
                    console.log("👆 CLIC SUR BOUTON");
                    
                    if (sidebar.style.display === 'none') {
                        console.log("✅ OUVERTURE");
                        sidebar.style.display = 'block';
                    } else {
                        console.log("❌ FERMETURE");
                        sidebar.style.display = 'none';
                    }
                });
                
                // 3. ✅ FERMETURE avec le bouton X
                const closeButtons = sidebar.querySelectorAll('.close, [aria-label="Close"]');
                closeButtons.forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.preventDefault();
                        console.log("👆 FERMETURE PAR BOUTON X");
                        sidebar.style.display = 'none';
                    });
                });
                
                // 4. ✅ NAVIGATION ENTRE FORMULAIRES
                const animationLinks = sidebar.querySelectorAll('.js-animation-link');
                animationLinks.forEach(link => {
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        
                        const targetId = this.getAttribute('data-target');
                        const linkGroup = this.getAttribute('data-link-group');
                        
                        console.log(`🔄 Changement vers: ${targetId}`);
                        
                        if (!targetId) return;
                        
                        // Cacher tous les formulaires du groupe
                        const groupForms = sidebar.querySelectorAll(`[data-target-group="${linkGroup}"]`);
                        groupForms.forEach(form => {
                            form.style.display = 'none';
                            form.style.opacity = '0';
                        });
                        
                        // Afficher le formulaire cible
                        const targetForm = sidebar.querySelector(targetId);
                        if (targetForm) {
                            targetForm.style.display = 'block';
                            targetForm.style.opacity = '1';
                            
                            // Optionnel: animation simple
                            targetForm.style.animation = 'fadeIn 0.3s';
                            setTimeout(() => {
                                targetForm.style.animation = '';
                            }, 300);
                        }
                    });
                });
                
                // 5. ✅ S'ASSURER QUE LE FORMULAIRE LOGIN EST VISIBLE PAR DÉFAUT
                const loginForm = sidebar.querySelector('#login');
                const signupForm = sidebar.querySelector('#signup');
                const forgotForm = sidebar.querySelector('#forgotPassword');
                
                if (loginForm) loginForm.style.display = 'block';
                if (signupForm) signupForm.style.display = 'none';
                if (forgotForm) forgotForm.style.display = 'none';
                
                // 6. ✅ FERMETURE EN CLIQUANT À L'EXTÉRIEUR (optionnel)
                document.addEventListener('click', function(e) {
                    if (sidebar.style.display === 'block' && 
                        !sidebar.contains(e.target) && 
                        e.target !== bouton &&
                        !bouton.contains(e.target)) {
                        console.log("👆 FERMETURE PAR CLIC EXTÉRIEUR");
                        sidebar.style.display = 'none';
                    }
                });

                // 🔥🔥🔥 NOUVEAU : Initialiser les formulaires
                initAuthForms();
                
                console.log("✅ Auth initialisé avec navigation");
            }

            // Ajouter l'animation fadeIn si pas déjà présente
            const style = document.createElement('style');
            style.textContent = `
                @keyframes fadeIn {
                    from { opacity: 0; transform: translateY(10px); }
                    to { opacity: 1; transform: translateY(0); }
                }
            `;
            document.head.appendChild(style);
            
            function initAuthForms() {
                console.log("📝 Initialisation des formulaires auth...");
                
                const sidebar = document.getElementById('sidebarContent');
                if (!sidebar) return;
                
                const form = sidebar.querySelector('form.js-validate');
                if (!form) return;
                
                // 🔴 NE PAS remplacer le formulaire, juste ajouter l'événement
                
                // Supprimer l'ancien événement submit s'il existe
                const oldForm = form;
                const newForm = oldForm.cloneNode(true);  // On clone quand même
                oldForm.parentNode.replaceChild(newForm, oldForm);
                
                // MAINTENANT, on réattache la navigation SUR LE NOUVEAU formulaire
                // car le clonage a supprimé tous les événements
                
                // Réattacher la navigation (tes liens .js-animation-link)
                const animationLinks = newForm.querySelectorAll('.js-animation-link');
                animationLinks.forEach(link => {
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        
                        const targetId = this.getAttribute('data-target');
                        const linkGroup = this.getAttribute('data-link-group');
                        
                        console.log(`🔄 Changement vers: ${targetId}`);
                        
                        if (!targetId) return;
                        
                        const groupForms = sidebar.querySelectorAll(`[data-target-group="${linkGroup}"]`);
                        groupForms.forEach(form => {
                            form.style.display = 'none';
                            form.style.opacity = '0';
                        });
                        
                        const targetForm = sidebar.querySelector(targetId);
                        if (targetForm) {
                            targetForm.style.display = 'block';
                            targetForm.style.opacity = '1';
                            targetForm.style.animation = 'fadeIn 0.3s';
                            setTimeout(() => {
                                targetForm.style.animation = '';
                            }, 300);
                        }
                    });
                });
                
                // Réattacher le bouton X
                const closeButtons = newForm.querySelectorAll('.close, [aria-label="Close"]');
                closeButtons.forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.preventDefault();
                        console.log("👆 FERMETURE PAR BOUTON X");
                        sidebar.style.display = 'none';
                    });
                });
                
                // ✅ MAINTENANT on attache l'événement submit
                newForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    console.log("📤 Formulaire soumis");
                    
                    const loginVisible = this.querySelector('#login').style.display !== 'none';
                    const signupVisible = this.querySelector('#signup').style.display !== 'none';
                    const forgotVisible = this.querySelector('#forgotPassword').style.display !== 'none';
                    
                    if (loginVisible) {
                        await handleLogin(this);
                    } else if (signupVisible) {
                        await handleSignup(this);
                    } else if (forgotVisible) {
                        await handleForgotPassword(this);
                    }
                });
                
                console.log("✅ Formulaires auth initialisés");
            }
        </script>

        <!-- ===============================================
            4. CHARGEMENT DES COMPOSANTS DYNAMIQUES
            =============================================== -->
        <script>
            document.addEventListener("DOMContentLoaded", () => {
                console.log("🚀 Début chargement composants...");

                // Navigation
                loadComponentByClass("nav-container", "/nav", reInitUI);

                // Recherche
                // Charger la recherche
                loadComponentByClass("search-container", "/search", function() {
                    reInitUI();
                    // Déclencher manuellement l'init de la recherche
                    if (typeof initSearchComponent === 'function') {
                        setTimeout(() => {
                            initSearchComponent();
                        }, 200);
                    }
                });

                // 🔐 AUTH - avec gestion spéciale
                loadComponentByClass("auth-container", "/auth", function() {
                    setTimeout(() => {
                        reInitUI();      // Réinitialisation générale
                        initAuth();      // Initialisation spécifique auth
                    }, 300);
                });

                // 📦 FOOTER - avec promo
                loadComponentByClass("footer-container", "/footer", function() {
                    reInitUI();
                    setTimeout(() => {
                        console.log("Chargement footer-promo...");
                        const script = document.createElement('script');
                        script.src = '/static/js/footer-promo.js';
                        document.body.appendChild(script);
                    }, 500);
                });

                // 📱 Menu mobile
                loadComponentByClass("mobile-menu-container", "/mobile-menu", reInitUI);
            });
        </script>
    </body>
</html>
